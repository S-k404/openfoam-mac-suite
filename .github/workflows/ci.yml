name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows 11 / monitor compatibility tests
        run: python -m unittest tests.test_win32_compat -v
